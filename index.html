<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sistema de Gestión Bancaria</title>

    <!-- Conectamos la hoja de estilos general -->
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <!-- Vista principal de login y registro -->
    <main class="auth-page">
      <!-- Encabezado con título y la versión -->
      <header class="auth-header">
        <h1>Sistema de Gestión Bancaria</h1>

        <p>Accede o crea una cuenta para continuar</p>

        <span> Versión v0.10.0 </span>
      </header>

      <!-- Aquí metí las dos tarjetas para entrar o registrarse -->
      <section class="auth-container">
        <!-- Formulario para los que ya tienen cuenta -->
        <article class="auth-card">
          <h2>Iniciar sesión</h2>

          <form id="formLogin" novalidate>
            <div class="form-group">
              <label for="loginEmail"> Correo electrónico </label>
              <input type="email" id="loginEmail" autocomplete="email" />
            </div>

            <div class="form-group">
              <label for="loginPassword"> Contraseña </label>

              <input
                type="password"
                id="loginPassword"
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="btn btn-primary">
              Iniciar sesión
            </button>
          </form>
        </article>

        <!-- Formulario para usuarios nuevos -->
        <article class="auth-card">
          <h2>Crear cuenta</h2>

          <form id="formRegistro" novalidate>
            <div class="form-group">
              <label for="registroNombre"> Nombre completo </label>

              <input type="text" id="registroNombre" />
            </div>

            <div class="form-group">
              <label for="registroEmail"> Correo electrónico </label>

              <input type="email" id="registroEmail" autocomplete="email" />
            </div>

            <div class="form-group">
              <label for="registroTelefono"> Teléfono </label>

              <input type="tel" id="registroTelefono" />
            </div>

            <div class="form-group">
              <label for="registroPassword"> Contraseña </label>
              <input
                type="password"
                id="registroPassword"
                autocomplete="new-password"
              />
            </div>

            <div class="form-group">
              <label for="registroConfirmPassword">
                Confirmar contraseña
              </label>

              <input
                type="password"
                id="registroConfirmPassword"
                autocomplete="new-password"
              />
            </div>

            <button type="submit" class="btn btn-primary">Crear cuenta</button>
          </form>
        </article>
      </section>
    </main>

    <!-- La librería de SweetAlert para los avisos bonitos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- El script es JS -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
